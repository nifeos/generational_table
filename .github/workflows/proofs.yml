name: proofs
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  # The push on main is what the release gate reads. A pull request's runs are recorded at the
  # pull request's head SHA, never at the merge commit a release dispatches at, so without this
  # trigger no release can pass the gate.
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  proofs:
    uses: nifeos/crate-workflows/.github/workflows/proofs.yml@e0c1fcaddff6b5c4afb2e0986a258c5c99eda6f0
