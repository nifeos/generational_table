[package]
name = "generational_table"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "A fixed-capacity, allocation-free generational table (a slotmap) with Kani-proven stale-name safety"
license = "MIT OR Apache-2.0"
repository = "https://github.com/nifeos/generational_table"
readme = "README.md"
keywords = ["no-std", "slotmap", "generational-index", "arena", "kani"]
categories = ["no-std", "data-structures"]
# What the package carries: the crate and the licenses. The fuzz targets, the repository's workflows,
# hooks, process documents and lint settings stay out.
include = [
    "/src/**",
    "/Cargo.toml",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-APACHE",
    "/LICENSE-MIT",
]
# Held off crates.io until the first release; the release that publishes removes this line.
publish = false

[dependencies]

[lints.rust]
# `cfg(kani)` is set by the Kani model checker, which proves this crate's harnesses.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)', 'cfg(loom)'] }
unsafe_op_in_unsafe_fn = "warn"
missing_docs = "warn"

[lints.clippy]
undocumented_unsafe_blocks = "warn"
cast_ptr_alignment = "warn"
ptr_as_ptr = "warn"
semicolon_if_nothing_returned = "warn"
manual_let_else = "warn"
doc_markdown = "warn"
